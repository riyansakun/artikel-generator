<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Journal Gen - AI Academic Manuscript Assistant</title>
</head>
<body>
<div id="app-container" class="fixed inset-0 z-[9999] bg-gray-50 overflow-y-auto font-sans text-gray-800 flex flex-col w-full h-full">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    .blogger-element { display: none !important; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .loader { border-top-color: #3b82f6; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .markdown-body h1 { font-size: 2em; font-weight: bold; margin-bottom: 0.5em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
    .markdown-body h2 { font-size: 1.5em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
    .markdown-body h3 { font-size: 1.25em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
    .markdown-body p { margin-bottom: 1em; line-height: 1.6; }
    .markdown-body ul, .markdown-body ol { margin-bottom: 1em; padding-left: 2em; list-style-type: disc; }
    .markdown-body li { margin-bottom: 0.25em; }
  </style>

  <nav class="bg-white border-b shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center cursor-pointer" onclick="renderView('landing')">
          <i class="fa-solid fa-graduation-cap text-blue-600 text-2xl mr-2"></i>
          <span class="font-bold text-xl tracking-tight text-gray-900">Instant Journal Gen</span>
        </div>
        <div class="flex items-center space-x-4" id="nav-auth-buttons">
          <!-- Dinamis via JS -->
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-grow flex flex-col" id="main-content">
    <!-- View akan dirender di sini oleh JavaScript -->
  </main>

  <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-[10000] bg-gray-800 text-white px-6 py-3 rounded-lg shadow-xl flex items-center">
    <i id="toast-icon" class="fas mr-2"></i>
    <span id="toast-msg">Notification</span>
  </div>
</div>

<script>
const IS_PREVIEW = true; 
const GAS_URL = "URL_DEPLOY_GAS_ANDA_DISINI";

let currentUser = null; 
let currentView = 'landing';
let currentDraft = null;

const DUMMY_USERS = {
  'admin': { username: 'admin', password: 'edudigital', role: 'admin', tier: 'paid', articleCount: 0, apiKey: '' },
  'freeuser': { username: 'freeuser', password: 'edudigital', role: 'user', tier: 'free', articleCount: 2, apiKey: '' },
  'paiduser': { username: 'paiduser', password: 'edudigital', role: 'user', tier: 'paid', articleCount: 15, apiKey: 'dummy-ai-key-123' }
};

function initApp() {
  const savedUser = localStorage.getItem('journalGenUser');
  if (savedUser) {
    try {
      currentUser = JSON.parse(savedUser);
    } catch(e) {
      currentUser = null;
    }
  }
  
  if (currentUser) {
    renderView('dashboard');
  } else {
    renderView('landing');
  }
  updateNavbar();
}

function showToast(message, type = 'info') {
  const toast = document.getElementById('toast');
  const icon = document.getElementById('toast-icon');
  const msg = document.getElementById('toast-msg');
  if (!toast || !icon || !msg) return;
  
  msg.innerText = message;
  icon.className = 'fas mr-2 ';
  if (type === 'success') { icon.className += 'fa-check-circle text-green-400'; }
  else if (type === 'error') { icon.className += 'fa-exclamation-circle text-red-400'; }
  else { icon.className += 'fa-info-circle text-blue-400'; }
  
  toast.classList.remove('translate-y-20', 'opacity-0');
  setTimeout(() => {
    toast.classList.add('translate-y-20', 'opacity-0');
  }, 3000);
}

function updateNavbar() {
  const navBox = document.getElementById('nav-auth-buttons');
  if (!navBox) return;
  if (currentUser) {
    navBox.innerHTML = `
      <span class="text-sm text-gray-600 hidden sm:inline">Hi, <b>${currentUser.username}</b> (${currentUser.tier.toUpperCase()})</span>
      <button onclick="renderView('dashboard')" class="text-gray-600 hover:text-blue-600 px-3 py-2 text-sm font-medium transition"><i class="fa-solid fa-chart-line mr-1"></i> Dashboard</button>
      <button onclick="logout()" class="bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded text-sm font-medium transition"><i class="fa-solid fa-sign-out-alt mr-1"></i> Logout</button>
    `;
  } else {
    navBox.innerHTML = `
      <button onclick="renderView('login')" class="text-gray-600 hover:text-blue-600 px-3 py-2 text-sm font-medium transition">Login</button>
      <button onclick="renderView('register')" class="bg-blue-600 text-white hover:bg-blue-700 px-4 py-2 rounded text-sm font-medium transition shadow">Sign Up Free</button>
    `;
  }
}

function logout() {
  currentUser = null;
  localStorage.removeItem('journalGenUser');
  renderView('landing');
  showToast('Logged out successfully', 'success');
}

async function callBackend(action, payload) {
  if (IS_PREVIEW) {
    return simulateBackend(action, payload);
  }

  try {
    const response = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, payload: payload })
    });
    const result = await response.json();
    if (result.status === 'error') {
      throw new Error(result.message || 'Error occurred');
    }
    return result;
  } catch (error) {
    throw error;
  }
}

async function simulateBackend(action, payload) {
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      if (action === 'login') {
        const user = Object.values(DUMMY_USERS).find(u => u.username === payload.username && u.password === payload.password);
        if (user) resolve({ status: 'success', data: { username: user.username, role: user.role, tier: user.tier, articleCount: user.articleCount, apiKey: user.apiKey } });
        else reject(new Error('Invalid username or password. Try freeuser / edudigital'));
      }
      else if (action === 'register') {
        reject(new Error('Registration is disabled in preview mode. Please login with freeuser / edudigital'));
      }
      else if (action === 'saveApiKey') {
        currentUser.apiKey = payload.apiKey;
        resolve({ status: 'success', message: 'API Key Saved' });
      }
      else if (action === 'generateArticle') {
        if (currentUser.tier === 'free' && currentUser.articleCount >= 3) {
          reject(new Error('Free tier limit reached (3/3). Please upgrade.'));
          return;
        }
        if (currentUser.tier === 'paid' && !currentUser.apiKey) {
          reject(new Error('Please set your Google AI Studio API Key in the dashboard first.'));
          return;
        }
        
        currentUser.articleCount++;
        localStorage.setItem('journalGenUser', JSON.stringify(currentUser));
        
        const targetWords = parseInt(payload.wordCount || "1500");
        const repeatCount = Math.max(1, Math.floor(targetWords / 500));
        
        let expandedIntro = "";
        for(let i = 1; i <= repeatCount; i++) {
          expandedIntro += `Paragraf ${i}: Penelitian mengenai ${payload.topic} menjadi sangat krusial dalam dinamika akademis saat ini. Berbagai studi terdahulu telah menyoroti aspek fundamental ini, namun analisis komprehensif terkait metodologi ${payload.method} masih memerlukan pembahasan mendalam. Dalam konteks ini, urgensi penelitian berfokus pada penguatan kerangka teoritis dan praktis.\n\n`;
        }

        const dummyDraft = `
# ${payload.topic}

## Abstract
**Background:** This study explores ${payload.topic}. 
**Objective:** To understand the fundamental concepts and empirical relations.
**Method:** A ${payload.method} approach was utilized.
**Results:** [Insert expected results framework here].
**Conclusion:** The findings suggest significant implications for the field.
*Keywords: ${payload.topic.split(' ').slice(0,3).join(', ')}, academic, research*

## 1. Introduction
${expandedIntro}
**Research Gap:** What remains unexplored is how this applies in modern contexts.
**Novelty:** This research proposes a new theoretical framework.

## 2. Method
**Proposed Method:** We suggest a ${payload.method} design.
**Data Collection:** [Insert proposed data collection technique].
**Data Analysis:** [Insert proposed analysis method].

## 3. Results Framework
*Note: As actual data was not provided, below is the framework for presenting results.*
- [Insert sample characteristics]
- [Insert descriptive statistics / qualitative themes]
- [Insert main findings]

## 4. Discussion
The anticipated findings align with existing theories while challenging certain assumptions. Theoretical implications suggest a paradigm shift.

## 5. Conclusion
In conclusion, addressing ${payload.topic} requires comprehensive methodology. 
**Limitations:** Sample size and contextual constraints.

## References
[1] Author, A. (2023). A study on ${payload.topic}. *Journal of Excellence*, 1(1), 1-10.
        `;
        resolve({ status: 'success', data: { draft: dummyDraft, title: payload.topic } });
      }
    }, 800);
  });
}

            </div>

              <i class="fas fa-shield-alt text-green-500 text-2xl mb-3"></i>
              <h3 class="font-bold text-gray-900">Anti-Hallucination</h3>

          <div class="text-center mb-8">

            <p class="text-sm text-gray-500 mt-2">
              ${isLogin ? 'Preview Demo: <b>freeuser</b> / <b>edudigital</b> atau <b>paiduser</b> / <b>edudigital</b>' : 'Sign up to start generating journal drafts.'}

                <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-bold uppercase">${currentUser.tier}</span>
              </div>
              ${isFree ? `
                <div class="mt-4">
                  <div class="flex justify-between text-sm mb-1">
                    <span class="text-gray-600">Quota Usage</span>
                    <span class="font-medium ${currentUser.articleCount >= 3 ? 'text-red-600' : 'text-gray-900'}">${currentUser.articleCount} / 3 Articles</span>

                    <div class="bg-blue-600 h-2.5 rounded-full" style="width: ${usagePercent}%"></div>

            </div>
          </div>
        </div>
      </div>
    `;
  }

  else if (viewName === 'generator') {
    main.innerHTML = `

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>

                  <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Target Word Count</label>
                <input type="number" id="gen-words" required min="500" max="10000" step="100" value="2500" placeholder="e.g., 2500" class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2.5 border">

  else if (viewName === 'result') {

      .replace(/^### (.*$)/gim, '<h3>$1</h3>')
      .replace(/^## (.*$)/gim, '<h2>$1</h2>')
      .replace(/^# (.*$)/gim, '<h1>$1</h1>')
      .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/gim, '<em>$1</em>')
      .replace(/^\- (.*$)/gim, '<ul><li>$1</li></ul>')
      .replace(/<\/ul>\n<ul>/gim, '')
      .replace(/\n\n/gim, '<p></p>');

            <button onclick="showToast('Feature available in Pro version', 'info')" class="w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-gray-100 transition flex items-center text-sm">
              <i class="fas fa-check-double mr-2 w-5 text-center"></i> Quality Assessment

            <button onclick="showToast('Feature available in Pro version', 'info')" class="w-full text-left px-4 py-2 text-gray-600 rounded-lg hover:bg-gray-100 transition flex items-center text-sm">
              <i class="fas fa-user-check mr-2 w-5 text-center"></i> Reviewer Simulation
            </button>
          </div>
          <div class="p-4 border-t">
            <button onclick="renderView('dashboard')" class="w-full text-center px-4 py-2 text-gray-600 border rounded-lg hover:bg-gray-50 text-sm font-medium">Back to Dashboard</button>

        </div>

        <div class="flex-grow flex flex-col overflow-y-auto">
          <div class="bg-white m-4 md:m-8 p-8 md:p-12 rounded-xl shadow-sm max-w-4xl mx-auto w-full border border-gray-100">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
              <div>
                <span class="px-2.5 py-1 bg-green-100 text-green-800 text-xs font-bold rounded-full uppercase">Draft Generated</span>
                <div class="text-xs text-gray-500 mt-1">Review and customize your manuscript draft below.</div>
              </div>

    `;
  }
}

async function handleAuth(e, type) {
  e.preventDefault();
  const btn = document.getElementById('auth-btn');
  const user = document.getElementById('auth-user').value;
  const pass = document.getElementById('auth-pass').value;
  let tier = 'free';
  if (type === 'register') {
    const tierElem = document.getElementById('auth-tier');
    if (tierElem) tier = tierElem.value;
  }

  btn.disabled = true;
  btn.innerText = 'Processing...';

  try {
    const res = await callBackend(type, { username: user, password: pass, tier: tier });
    currentUser = res.data;
    localStorage.setItem('journalGenUser', JSON.stringify(currentUser));
    showToast(`Welcome, ${currentUser.username}!`, 'success');
    renderView('dashboard');
  } catch (error) {
    showToast(error.message || 'Authentication failed', 'error');
  } finally {
    btn.disabled = false;
    btn.innerText = type === 'login' ? 'Sign In' : 'Register';
  }
}

async function handleSaveApiKey(e) {
  e.preventDefault();
  const key = document.getElementById('user-api-key').value;
  try {
    await callBackend('saveApiKey', { username: currentUser.username, apiKey: key });
    currentUser.apiKey = key;
    localStorage.setItem('journalGenUser', JSON.stringify(currentUser));
    showToast('API Key saved successfully', 'success');
  } catch (err) {
    showToast(err.message || 'Failed to save API Key', 'error');
  }
}

async function handleGenerate(e) {
  e.preventDefault();
  
  if (currentUser.tier === 'free' && currentUser.articleCount >= 3) {
    showToast('Free tier limit reached. Please upgrade.', 'error');
    return;
  }
  if (currentUser.tier === 'paid' && !currentUser.apiKey) {
    showToast('Please set your Google AI Studio API Key in the dashboard.', 'error');
    return;
  }

  const payload = {
    username: currentUser.username,
    topic: document.getElementById('gen-topic').value,
    language: document.getElementById('gen-lang').value,
    wordCount: document.getElementById('gen-words').value,
    method: document.getElementById('gen-method').value,
    citation: document.getElementById('gen-citation').value
  };

  document.getElementById('generate-form').classList.add('hidden');
  const progressContainer = document.getElementById('progress-container');
  progressContainer.classList.remove('hidden');
  
  const steps = [
    "Analyzing Research Topic...",
    "Identifying Research Problem & Gap...",
    "Designing Research Method...",
    "Building Article Structure...",
    "Generating Manuscript (Anti-Hallucination Active)...",
    "Formatting Citations & Finalizing..."
  ];
  const stepText = document.getElementById('progress-text');
  const bar = document.getElementById('progress-bar');
  const stepList = document.getElementById('progress-steps');
  
  let stepIndex = 0;
  
  const progressInterval = setInterval(() => {
    if(stepIndex < steps.length - 1) {
      stepText.innerText = steps[stepIndex];
      bar.style.width = `${(stepIndex + 1) * 15}%`;
      stepList.innerHTML += `<li><i class="fas fa-check text-green-500 mr-1"></i> ${steps[stepIndex]}</li>`;
      stepIndex++;
    }
  }, 1200);

  try {
    const res = await callBackend('generateArticle', payload);
    
    clearInterval(progressInterval);
    bar.style.width = '100%';
    stepText.innerText = "Generation Complete!";
    
    if(currentUser.tier === 'free') {
      currentUser.articleCount++;
      localStorage.setItem('journalGenUser', JSON.stringify(currentUser));
    }
    
    currentDraft = res.data;
    
    setTimeout(() => {
      renderView('result');
      showToast('Draft generated successfully!', 'success');
    }, 600);

  } catch (error) {
    clearInterval(progressInterval);
    document.getElementById('generate-form').classList.remove('hidden');
    progressContainer.classList.add('hidden');
    showToast(error.message || 'Generation failed', 'error');
  }
}

function exportToDocx() {
  if(!currentDraft) return;
  const preHtml = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML To Doc</title></head><body>";
  const postHtml = "</body></html>";
  const content = document.getElementById('draft-content').innerHTML;
  const html = preHtml + content + postHtml;

  const blob = new Blob(['\ufeff', html], {
      type: 'application/msword'
  });
  
  const url = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(html);
  const filename = currentDraft.title ? currentDraft.title.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.doc' : 'document.doc';
  
  const downloadLink = document.createElement("a");
  document.body.appendChild(downloadLink);
  
  if(navigator.msSaveOrOpenBlob ){
      navigator.msSaveOrOpenBlob(blob, filename);
  } else {
      downloadLink.href = url;
      downloadLink.download = filename;
      downloadLink.click();
  }
  document.body.removeChild(downloadLink);
  showToast('Downloading DOCX...', 'success');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
